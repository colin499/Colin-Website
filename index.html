<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Food</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=33447e12">
</head>
<body>
    <header>
        <a href="#" class="site-title" onclick="goTo('home'); return false;">Brain Food</a>
    </header>

    <main id="feed"></main>

    <!-- The buttons float in front of every card. -->
    <nav class="dock" aria-label="Sections">
        <a href="#paintings" data-section="paintings" onclick="playButtonSound('paintings'); goTo('paintings'); return false;">paintings</a>
        <a href="#writing" data-section="writing" onclick="playButtonSound('writing'); goTo('writing'); return false;">writing</a>
        <a href="#projects" data-section="projects" onclick="playButtonSound('projects'); goTo('projects'); return false;">projects</a>
        <a href="#cha" data-section="cha" onclick="playButtonSound('cha'); goTo('cha'); return false;">cha</a>
        <a href="#contact" data-section="contact" onclick="playButtonSound('contact'); goTo('contact'); return false;">contact</a>
    </nav>

    <div id="walker" aria-hidden="true">
        <img src="assets/colin-and-cat.png" alt="">
    </div>

    <div id="lightbox" onclick="closeLightbox()">
        <button class="lightbox-close" onclick="event.stopPropagation(); closeLightbox()" aria-label="Close">×</button>
        <button class="lightbox-arrow lightbox-prev" onclick="event.stopPropagation(); stepLightbox(-1)" aria-label="Previous painting">←</button>
        <div class="lightbox-stage" onclick="event.stopPropagation()">
            <img id="lightbox-img" src="" alt="">
            <div id="lightbox-title"></div>
        </div>
        <button class="lightbox-arrow lightbox-next" onclick="event.stopPropagation(); stepLightbox(1)" aria-label="Next painting">→</button>
    </div>

    <script src="posts.js?v=d18bb220"></script>
    <script src="game.js?v=f5f3f286"></script>
    <script src="main.js?v=71305d4b"></script>
</body>
</html>
